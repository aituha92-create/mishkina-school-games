<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Игра: Собери слово</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            --container-bg: rgba(255, 255, 255, 0.96);
            --primary-btn: #FF6B6B;
            --success-color: #27ae60;
            --text-main: #2c3e50;
            --ball-size: 90px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 20px;
            font-family: 'Calibri', 'Segoe UI', sans-serif; /* Шрифт Calibri */
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-wrapper {
            background: var(--container-bg);
            border-radius: 25px;
            padding: 25px 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            border: 3px dashed #f8b595;
        }

        h1 { 
            margin: 0; 
            color: var(--text-main); 
            font-size: 2rem; 
            font-weight: 700; /* Bold */
            letter-spacing: 0.5px;
        }
        
        .progress { color: #e67e22; font-weight: 600; font-size: 1rem; margin-top: -4px; }
        .hint { color: #7f8c8d; margin: 0; font-size: 1rem; font-weight: 400; }

        .board {
            display: flex;
            justify-content: center;
            gap: 12px;
            min-height: var(--ball-size);
            padding: 15px 0;
            flex-wrap: wrap;
        }

        .ball {
            width: var(--ball-size);
            height: var(--ball-size);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.25);
            cursor: grab;
            touch-action: none;
            position: relative;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            user-select: none;
            box-shadow: inset -4px -5px 8px rgba(0,0,0,0.15), 0 5px 10px rgba(0,0,0,0.12);
        }

        .ball:active { cursor: grabbing; transform: scale(1.05); z-index: 20; }
        .ball.dragging { opacity: 0.5; transform: scale(0.95); }
        .ball.success { background: radial-gradient(circle at 30% 30%, #ffd700, #ffaa00) !important; box-shadow: 0 0 15px rgba(255, 215, 0, 0.6); }

        .feedback {
            min-height: 40px;
            color: var(--success-color);
            font-size: 1.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(5px);
            transition: all 0.3s ease;
            margin: 0;
        }
        .feedback.show { opacity: 1; transform: translateY(0); }

        .btn-container { margin-top: 10px; display: flex; justify-content: center; }

        button {
            background: var(--primary-btn);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 5px 0 #d9534f;
            transition: all 0.1s;
            font-family: 'Calibri', sans-serif;
        }
        button:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 2px 0 #d9534f; }
        button:disabled { background: #bdc3c7; box-shadow: 0 5px 0 #95a5a6; cursor: not-allowed; transform: none; opacity: 0.7; }

        .confetti {
            position: fixed;
            width: 10px; height: 10px;
            animation: fall linear forwards;
            z-index: 50;
            border-radius: 2px;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .end-screen { display: none; flex-direction: column; align-items: center; gap: 15px; padding: 20px 0; }
        .end-screen h2 { color: var(--text-main); margin: 0; font-size: 2rem; font-weight: 700; }
        .end-screen p { color: #7f8c8d; margin: 0; font-size: 1.2rem; font-weight: 400; line-height: 1.5; }

        #mi-return-to-library {
            position: fixed;
            top: max(12px, env(safe-area-inset-top, 0px));
            left: max(12px, env(safe-area-inset-left, 0px));
            z-index: 10000;
            display: inline-flex;
            min-height: 48px;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border: 2px solid #fff1d5;
            border-radius: 999px;
            background: #461e1e;
            box-shadow: 0 4px 0 #2d1111, 0 6px 16px rgba(70, 30, 30, 0.2);
            color: #fff;
            font-family: Nunito, "Segoe UI", Arial, sans-serif;
            font-size: 16px;
            font-weight: 800;
            line-height: 1.2;
            text-decoration: none;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: background 150ms ease, box-shadow 150ms ease;
        }

        #mi-return-to-library:hover {
            background: #5a2924;
            box-shadow: 0 6px 0 #2d1111, 0 9px 18px rgba(70, 30, 30, 0.22);
        }

        #mi-return-to-library:active {
            box-shadow: 0 2px 0 #2d1111;
        }

        #mi-return-to-library:focus-visible {
            outline: 3px solid #286eab;
            outline-offset: 3px;
        }

        @media (max-width: 480px) {
            #mi-return-to-library {
                min-height: 44px;
                padding: 8px 12px;
                font-size: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #mi-return-to-library { transition: none; }
        }
    </style>
</head>
<body>
    <nav aria-label="Навигация по играм"><a id="mi-return-to-library" href="../../index.html">🏠 В игротеку</a></nav>

<div class="game-wrapper">
    <div id="play-area">
        <h1>Собери слово</h1>
        <div class="progress" id="progress">Слово 1 / 27</div>
        <p class="hint">Перетаскивай буквы, чтобы сложить слово</p>
        
        <div class="board" id="board"></div>
        <div class="feedback" id="message">Молодец!</div>
        
        <div class="btn-container">
            <button id="next-btn" disabled>Дальше →</button>
        </div>
    </div>

    <div class="end-screen" id="end-screen">
        <h2>🎉 Отличная работа!</h2>
        <p>Ты собрал все слова!<br>Попробуй сыграть ещё раз?</p>
        <button onclick="location.reload()">Начать заново</button>
    </div>
</div>

<script>
    const words = ["каша", "кино", "коза", "кофе", "сова", "нора", "няня", "нога", "небо", "ноты", "лиса", "лапа", "лыжи", "луна", "рука", "рама", "роза", "рыба", "рана", "вода", "пила", "пена", "паук", "мука", "муха", "бусы", "баня"];
    
    // Яркие цвета для шаров
    const ballColors = [
        'linear-gradient(135deg, #FF6B6B, #ee5253)',
        'linear-gradient(135deg, #48dbfb, #0abde3)',
        'linear-gradient(135deg, #feca57, #ff9f43)',
        'linear-gradient(135deg, #1dd1a1, #10ac84)',
        'linear-gradient(135deg, #5f27cd, #341f97)',
        'linear-gradient(135deg, #ff9ff3, #f368e0)',
        'linear-gradient(135deg, #54a0ff, #2e86de)',
        'linear-gradient(135deg, #8395a7, #576574)'
    ];

    let currentWordIndex = 0;
    let currentWord = "";
    let shuffledLetters = [];
    
    const board = document.getElementById('board');
    const nextBtn = document.getElementById('next-btn');
    const messageEl = document.getElementById('message');
    const progressEl = document.getElementById('progress');
    const playArea = document.getElementById('play-area');
    const endScreen = document.getElementById('end-screen');

    function initGame() {
        if (currentWordIndex >= words.length) {
            playArea.style.display = 'none';
            endScreen.style.display = 'flex';
            return;
        }

        currentWord = words[currentWordIndex];
        progressEl.textContent = `Слово ${currentWordIndex + 1} / ${words.length}`;
        shuffledLetters = shuffleArray(currentWord.split(''));
        
        renderBalls();
        nextBtn.disabled = true;
        messageEl.classList.remove('show');
    }

    function renderBalls() {
        board.innerHTML = '';
        shuffledLetters.forEach((letter, index) => {
            const ball = document.createElement('div');
            ball.classList.add('ball');
            ball.textContent = letter;
            ball.style.background = ballColors[index % ballColors.length];
            ball.setAttribute('draggable', 'true');
            ball.dataset.index = index;
            
            // Desktop Drag & Drop
            ball.addEventListener('dragstart', handleDragStart);
            ball.addEventListener('dragover', handleDragOver);
            ball.addEventListener('drop', handleDrop);
            ball.addEventListener('dragend', handleDragEnd);
            
            // Mobile Touch
            ball.addEventListener('touchstart', handleTouchStart, {passive: false});
            ball.addEventListener('touchend', handleTouchEnd);

            board.appendChild(ball);
        });
    }

    let dragSrcEl = null;
    let touchSrcEl = null;

    function handleDragStart(e) { dragSrcEl = this; this.style.opacity = '0.4'; }
    function handleDragEnd() { if(this) this.style.opacity = '1'; }
    function handleDragOver(e) { e.preventDefault(); return false; }
    
    function handleDrop(e) {
        e.preventDefault();
        if (dragSrcEl && dragSrcEl !== this) {
            swapBalls(dragSrcEl, this);
        }
    }

    function handleTouchStart(e) {
        e.preventDefault();
        touchSrcEl = this;
        this.classList.add('dragging');
    }

    function handleTouchEnd(e) {
        this.classList.remove('dragging');
        const touch = e.changedTouches[0];
        const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
        if (elemBelow && elemBelow.classList.contains('ball') && elemBelow !== touchSrcEl) {
            swapBalls(touchSrcEl, elemBelow);
        }
        touchSrcEl = null;
    }

    function swapBalls(el1, el2) {
        const idx1 = parseInt(el1.dataset.index);
        const idx2 = parseInt(el2.dataset.index);
        [shuffledLetters[idx1], shuffledLetters[idx2]] = [shuffledLetters[idx2], shuffledLetters[idx1]];
        renderBalls();
        checkWin();
    }

    function checkWin() {
        if (shuffledLetters.join('') === currentWord) {
            messageEl.textContent = `Молодец! Слово: "${currentWord}"`;
            messageEl.classList.add('show');
            nextBtn.disabled = false;
            board.querySelectorAll('.ball').forEach(ball => ball.classList.add('success'));
            createConfetti();
        }
    }

    function createConfetti() {
        const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#95e1d3', '#a29bfe'];
        for(let i=0; i<35; i++) {
            const c = document.createElement('div');
            c.classList.add('confetti');
            c.style.left = Math.random() * 100 + 'vw';
            c.style.top = '-10px';
            c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            c.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            c.style.width = (Math.random() * 8 + 6) + 'px';
            c.style.height = (Math.random() * 8 + 6) + 'px';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 3500);
        }
    }

    function shuffleArray(array) {
        let newArr = [...array];
        for (let i = newArr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
        }
        // Гарантируем, что стартовое состояние не является решением
        if (newArr.join('') === array.join('')) return shuffleArray(array);
        return newArr;
    }

    nextBtn.addEventListener('click', () => {
        currentWordIndex++;
        initGame();
    });

    initGame();
</script>

</body>
</html>
