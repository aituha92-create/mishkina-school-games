    .word-card {

      border: 3px solid #ffd54f;
      cursor: grab;
    }

    .word-card.used {
      opacity: 0.3;
      cursor: default;
      pointer-events: none;
    }

    .drag-clone {
      position: fixed;
      z-index: 100;
      pointer-events: none;
      opacity: 0.85;
      transform: scale(1.05);
    }

    .drop-zone {
      border: 3px dashed #999;
      background: #f8f8f8;
    }

    .drop-zone.correct {
      background: #c8e6c9;
      border-color: #4caf50;

    .drop-zone.incorrect {

    @media (max-width: 380px) {

  <script>
    const animals = [
      { word: "лошадь", emoji: "🐴" },
      { word: "коза", emoji: "🐐" },
      { word: "корова", emoji: "🐄" },
      { word: "овца", emoji: "🐑" },
      { word: "собака", emoji: "🐶" },
      { word: "кошка", emoji: "🐱" }
    ];

    const shuffledWords = [...animals].sort(() => Math.random() - 0.5);
    const gridContainer = document.getElementById('gridContainer');
    const successMessage = document.getElementById('successMessage');
    const applauseSound = document.getElementById('applauseSound');

    let draggedOriginal = null;
    let dragClone = null;
    let offsetX = 0;
    let offsetY = 0;

    // Создаём строки
    animals.forEach((animal, index) => {
      const row = document.createElement('div');
      row.className = 'grid-row';

      const wordCard = document.createElement('div');
      wordCard.className = 'word-card';
      wordCard.textContent = shuffledWords[index].word;
      wordCard.dataset.word = shuffledWords[index].word;
      wordCard.dataset.active = 'true';

      const imageWrapper = document.createElement('div');
      imageWrapper.className = 'image-wrapper';

      const imgBox = document.createElement('div');
      imgBox.className = 'animal-image';
      imgBox.textContent = animal.emoji;

      const dropZone = document.createElement('div');
      dropZone.className = 'drop-zone';
      dropZone.dataset.targetWord = animal.word;

      imageWrapper.appendChild(imgBox);
      imageWrapper.appendChild(dropZone);

      row.appendChild(wordCard);
      row.appendChild(imageWrapper);

      gridContainer.appendChild(row);
    });

    function createDragClone(original, x, y) {
      const clone = original.cloneNode(true);
      clone.className = 'drag-clone';
      clone.style.width = original.offsetWidth + 'px';
      clone.style.height = original.offsetHeight + 'px';
      clone.style.left = (x - original.offsetWidth / 2) + 'px';
      clone.style.top = (y - original.offsetHeight / 2) + 'px';
      document.body.appendChild(clone);
      return clone;
    }

    function handleDragStart(e) {
      if (this.dataset.active !== 'true') return;

      draggedOriginal = this;

      let clientX, clientY;
      if (e.type === 'mousedown') {
        clientX = e.clientX;
        clientY = e.clientY;
        document.addEventListener('mousemove', handleDragMove);
        document.addEventListener('mouseup', handleDrop);
      } else if (e.type === 'touchstart') {
        const touch = e.touches[0];
        clientX = touch.clientX;
        clientY = touch.clientY;
        document.addEventListener('touchmove', handleDragMove, { passive: false });
        document.addEventListener('touchend', handleDrop);
      }

      // Создаём клон под курсором/пальцем
      dragClone = createDragClone(this, clientX, clientY);

      // Делаем оригинал полупрозрачным, но он остаётся в потоке!
      this.style.opacity = '0.4';

      e.preventDefault();
    }

    function handleDragMove(e) {
      if (!draggedOriginal || !dragClone) return;

      let clientX, clientY;
      if (e.type === 'mousemove') {
        clientX = e.clientX;
        clientY = e.clientY;
      } else if (e.type === 'touchmove') {
        const touch = e.touches[0];
        clientX = touch.clientX;
        clientY = touch.clientY;
        e.preventDefault();
      }

      dragClone.style.left = (clientX - draggedOriginal.offsetWidth / 2) + 'px';
      dragClone.style.top = (clientY - draggedOriginal.offsetHeight / 2) + 'px';
    }

    function handleDrop() {
      if (!draggedOriginal || !dragClone) return;

      document.removeEventListener('mousemove', handleDragMove);
      document.removeEventListener('mouseup', handleDrop);
      document.removeEventListener('touchmove', handleDragMove);
      document.removeEventListener('touchend', handleDrop);

      // Удаляем клон
      dragClone.remove();
      dragClone = null;

      const dropZones = document.querySelectorAll('.drop-zone');
      const draggedWord = draggedOriginal.dataset.word;
      let droppedInZone = false;

      for (const zone of dropZones) {
        const rect = zone.getBoundingClientRect();
        const centerX = parseFloat(draggedOriginal.style.left || 0) + draggedOriginal.offsetWidth / 2;
        const centerY = parseFloat(draggedOriginal.style.top || 0) + draggedOriginal.offsetHeight / 2;

        // Но лучше использовать текущую позицию курсора из последнего события
        // Однако проще — проверить по позиции клона до удаления
        // Вместо этого: используем координаты из последнего move — но мы их не храним
        // Поэтому сделаем иначе: проверим по текущей позиции указателя (через event в замыкании — сложно)
        // Лучше: сохраним последнюю позицию
      }

      // Вместо этого — перепишем: сохраним lastX, lastY
    }

    // Перепишем с сохранением последней позиции
    let lastClientX = 0;
    let lastClientY = 0;

    function handleDragStartFixed(e) {
      if (this.dataset.active !== 'true') return;

      draggedOriginal = this;

      let clientX, clientY;
      if (e.type === 'mousedown') {
        clientX = e.clientX;
        clientY = e.clientY;
        document.addEventListener('mousemove', handleDragMoveFixed);
        document.addEventListener('mouseup', handleDropFixed);
      } else if (e.type === 'touchstart') {
        const touch = e.touches[0];
        clientX = touch.clientX;
        clientY = touch.clientY;
        document.addEventListener('touchmove', handleDragMoveFixed, { passive: false });
        document.addEventListener('touchend', handleDropFixed);
      }

      lastClientX = clientX;
      lastClientY = clientY;

      dragClone = createDragClone(this, clientX, clientY);
      this.style.opacity = '0.4';

      e.preventDefault();
    }

    function handleDragMoveFixed(e) {
      if (!draggedOriginal || !dragClone) return;

      let clientX, clientY;
      if (e.type === 'mousemove') {
        clientX = e.clientX;
        clientY = e.clientY;
      } else if (e.type === 'touchmove') {
        const touch = e.touches[0];
        clientX = touch.clientX;
        clientY = touch.clientY;
        e.preventDefault();
      }

      lastClientX = clientX;
      lastClientY = clientY;

      dragClone.style.left = (clientX - draggedOriginal.offsetWidth / 2) + 'px';
      dragClone.style.top = (clientY - draggedOriginal.offsetHeight / 2) + 'px';
    }

    function handleDropFixed() {
      if (!draggedOriginal || !dragClone) return;

      document.removeEventListener('mousemove', handleDragMoveFixed);
      document.removeEventListener('mouseup', handleDropFixed);
      document.removeEventListener('touchmove', handleDragMoveFixed);
      document.removeEventListener('touchend', handleDropFixed);

      dragClone.remove();
      dragClone = null;

      const dropZones = document.querySelectorAll('.drop-zone');
      const draggedWord = draggedOriginal.dataset.word;
      let success = false;

      for (const zone of dropZones) {
        const rect = zone.getBoundingClientRect();
        if (
          lastClientX >= rect.left &&
          lastClientX <= rect.right &&
          lastClientY >= rect.top &&
          lastClientY <= rect.bottom
        ) {
          const targetWord = zone.dataset.targetWord;
          if (targetWord === draggedWord && !zone.hasAttribute('data-filled')) {
            zone.textContent = draggedWord;
            zone.classList.add('correct');
            zone.setAttribute('data-filled', 'true');

            draggedOriginal.classList.add('used');
            draggedOriginal.removeAttribute('data-active');
            draggedOriginal.style.opacity = '';

            success = true;
            break;
          } else {
            zone.classList.add('incorrect');
            setTimeout(() => zone.classList.remove('incorrect'), 600);
          }
        }
      }

      if (!success) {
        // Возвращаем оригинал в нормальное состояние
        draggedOriginal.style.opacity = '';
      }

      draggedOriginal = null;
      checkWin();
    }

    function checkWin() {
      const zones = document.querySelectorAll('.drop-zone');
      const allFilled = Array.from(zones).every(zone => zone.hasAttribute('data-filled'));
      if (allFilled) {
        setTimeout(() => {
          applauseSound.play().catch(e => console.log("Звук:", e));
          successMessage.classList.add('show');
        }, 300);
      }
    }

    // Назначаем новые обработчики
    document.querySelectorAll('.word-card').forEach(card => {
      card.addEventListener('mousedown', handleDragStartFixed);
      card.addEventListener('touchstart', handleDragStartFixed, { passive: false });
    });

    successMessage.addEventListener('click', () => {
      successMessage.classList.remove('show');
    });
  </script>
