<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Найди слово!</title>

    <!-- Шрифт Nunito — округлый, детский, без засечек -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 50%, #d4a5ff 100%);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            overflow: hidden;
            user-select: none;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== Декоративные пузырьки ===== */
        .bubbles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bubble {
            position: absolute;
            border-radius: 50%;
            opacity: 0.18;
            animation: floatBubble linear infinite;
        }
        @keyframes floatBubble {
            0%   { transform: translateY(100vh) scale(0.4); opacity: 0; }
            10%  { opacity: 0.18; }
            90%  { opacity: 0.18; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ===== Заголовок ===== */
        .game-title {
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 900;
            color: #fff;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.1), 0 0 20px rgba(255,255,255,0.5);
            margin-bottom: 10px;
            z-index: 1;
            letter-spacing: 1px;
        }

        .progress-bar-container {
            width: min(90vw, 420px);
            height: 18px;
            background: rgba(255,255,255,0.4);
            border-radius: 20px;
            margin-bottom: 18px;
            z-index: 1;
            overflow: hidden;
            backdrop-filter: blur(4px);
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff9a9e, #fecfef, #a18cd1);
            border-radius: 20px;
            transition: width 0.6s cubic-bezier(.4,0,.2,1);
        }

        /* ===== Игровое поле ===== */
        .game-field {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 200px 1fr;
            grid-template-rows: auto auto auto;
            align-items: center;
            justify-items: center;
            gap: 18px;
            padding: 20px;
        }

        /* ===== Изображение-заглушка ===== */
        .image-container {
            grid-column: 2;
            grid-row: 2;
            width: 200px;
            height: 200px;
            border-radius: 32px;
            background: #fff;
            box-shadow: 0 12px 40px rgba(0,0,0,0.12), 0 0 0 6px rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: transform 0.5s ease, opacity 0.5s ease;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 32px;
        }

        /* Заглушка — удалите этот блок когда вставите своё PNG */
        .image-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            padding: 10px;
        }
        .image-placeholder .placeholder-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }
        .image-placeholder .placeholder-hint {
            font-size: 12px;
            color: #ccc;
            font-weight: 400;
        }

        .image-container.hide {
            transform: scale(0.3) rotate(10deg);
            opacity: 0;
        }

        /* ===== Карточки со словами ===== */
        .word-card {
            padding: 14px 28px;
            font-size: 22px;
            font-weight: 800;
            color: #555;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(6px);
            border: 3px solid rgba(255,255,255,0.9);
            border-radius: 22px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            min-width: 120px;
            text-align: center;
            animation: wobble 3s ease-in-out infinite;
        }

        .word-card:hover {
            transform: scale(1.1) !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            background: #fff;
        }

        .word-card:active {
            transform: scale(0.95) !important;
        }

        .word-card.correct {
            background: linear-gradient(135deg, #a8ff78, #78ffd6);
            border-color: #78ffd6;
            color: #2d7a3a;
            animation: none;
            transform: scale(1.15);
        }

        .word-card.wrong {
            animation: shake 0.5s ease;
            background: #ffe0e0;
            border-color: #ff9a9a;
            color: #c0392b;
        }

        .word-card.hide {
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
        }

        /* Позиции карточек */
        .word-card[data-pos="top"]    { grid-column: 2; grid-row: 1; }
        .word-card[data-pos="bottom"] { grid-column: 2; grid-row: 3; }
        .word-card[data-pos="left"]   { grid-column: 1; grid-row: 2; }
        .word-card[data-pos="right"]  { grid-column: 3; grid-row: 2; }

        /* ===== Покачивание ===== */
        @keyframes wobble {
            0%, 100% { transform: rotate(-3deg); }
            25%      { transform: rotate(3deg); }
            50%      { transform: rotate(-2deg); }
            75%      { transform: rotate(2.5deg); }
        }

        .word-card[data-pos="top"]    { animation-delay: 0s; }
        .word-card[data-pos="bottom"] { animation-delay: 0.5s; }
        .word-card[data-pos="left"]   { animation-delay: 1s; }
        .word-card[data-pos="right"]  { animation-delay: 1.5s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%      { transform: translateX(-10px); }
            40%      { transform: translateX(10px); }
            60%      { transform: translateX(-6px); }
            80%      { transform: translateX(6px); }
        }

        /* ===== Сообщение ===== */
        .message-overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .message-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .message-box {
            background: #fff;
            border-radius: 32px;
            padding: 30px 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            text-align: center;
            transform: scale(0.5);
            transition: transform 0.4s cubic-bezier(.2,1,.3,1);
        }
        .message-overlay.show .message-box {
            transform: scale(1);
        }
        .message-box .emoji {
            font-size: 56px;
            display: block;
            margin-bottom: 8px;
        }
        .message-box .text {
            font-size: 28px;
            font-weight: 900;
            color: #6c5ce7;
        }

        /* ===== Финальный экран ===== */
        .final-screen {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #a8edea, #fed6e3, #d4a5ff);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }
        .final-screen.show {
            opacity: 1;
            pointer-events: auto;
        }
        .final-screen .trophy {
            font-size: 90px;
            animation: bounce 1s ease infinite;
        }
        .final-screen .final-text {
            font-size: 36px;
            font-weight: 900;
            color: #fff;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
            margin-top: 16px;
        }
        .final-screen .final-sub {
            font-size: 20px;
            font-weight: 600;
            color: rgba(255,255,255,0.85);
            margin-top: 8px;
        }
        .restart-btn {
            margin-top: 28px;
            padding: 16px 44px;
            font-size: 20px;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            color: #fff;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(108,92,231,0.4);
            transition: transform 0.2s ease;
        }
        .restart-btn:hover { transform: scale(1.08); }
        .restart-btn:active { transform: scale(0.96); }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-18px); }
        }

        /* ===== Адаптив ===== */
        @media (max-width: 600px) {
            .game-field {
                grid-template-columns: 1fr 160px 1fr;
                gap: 10px;
                padding: 12px;
            }
            .image-container {
                width: 160px;
                height: 160px;
            }
            .word-card {
                padding: 10px 16px;
                font-size: 18px;
                min-width: 90px;
                border-radius: 16px;
            }
        }

        #mi-return-to-library {
            position: fixed;
            top: max(12px, env(safe-area-inset-top, 0px));
            left: max(12px, env(safe-area-inset-left, 0px));
            z-index: 10000;
            display: inline-flex;
            min-height: 48px;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border: 2px solid #fff1d5;
            border-radius: 999px;
            background: #461e1e;
            box-shadow: 0 4px 0 #2d1111, 0 6px 16px rgba(70, 30, 30, 0.2);
            color: #fff;
            font-family: Nunito, "Segoe UI", Arial, sans-serif;
            font-size: 16px;
            font-weight: 800;
            line-height: 1.2;
            text-decoration: none;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: background 150ms ease, box-shadow 150ms ease;
        }

        #mi-return-to-library:hover {
            background: #5a2924;
            box-shadow: 0 6px 0 #2d1111, 0 9px 18px rgba(70, 30, 30, 0.22);
        }

        #mi-return-to-library:active {
            box-shadow: 0 2px 0 #2d1111;
        }

        #mi-return-to-library:focus-visible {
            outline: 3px solid #286eab;
            outline-offset: 3px;
        }

        @media (max-width: 480px) {
            #mi-return-to-library {
                min-height: 44px;
                padding: 8px 12px;
                font-size: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #mi-return-to-library { transition: none; }
        }
    </style>
</head>
<body>
    <nav aria-label="Навигация по играм"><a id="mi-return-to-library" href="https://xn----7sbb3aaldicno7if.xn--p1ai/#rec4760395701">🏠 В игротеку</a></nav>

<!-- Декоративные пузырьки -->
<div class="bubbles" id="bubbles"></div>

<!-- Заголовок -->
<div class="game-title">🔍 Найди слово!</div>

<!-- Прогресс -->
<div class="progress-bar-container">
    <div class="progress-bar-fill" id="progressBar"></div>
</div>

<!-- Игровое поле -->
<div class="game-field" id="gameField">
    <!-- Карточки будут вставлены JS -->
    <!-- Изображение -->
    <div class="image-container" id="imageContainer">
    
        <img id="gameImage" src="" alt=""> 
        </div>
    </div>
</div>

<!-- Сообщение -->
<div class="message-overlay" id="messageOverlay">
    <div class="message-box">
        <span class="emoji" id="msgEmoji">🎉</span>
        <span class="text" id="msgText">Круто! Продолжай!</span>
    </div>
</div>

<!-- Финальный экран -->
<div class="final-screen" id="finalScreen">
    <div class="trophy">🏆</div>
    <div class="final-text">Ты прошёл всю игру!</div>
    <div class="final-sub">Ты знаешь все слова! 🌟</div>
    <button class="restart-btn" onclick="restartGame()">Играть снова</button>
</div>

<script>
    const levels = [
        { word: "кот", image: "images/кот.png" },
        { word: "мак", image: "images/мак.png" },
        { word: "рак", image: "images/рак.png" },
        { word: "рот", image: "images/рот.png" },
        { word: "жук", image: "images/жук.png" },
        { word: "лук", image: "images/лук.png" },
        { word: "дуб", image: "images/дуб.png" },
        { word: "сок", image: "images/сок.png" },
        { word: "сыр", image: "images/сыр.png" },
        { word: "чай", image: "images/чай.png" },
        { word: "мяч", image: "images/мяч.png" },
        { word: "лес", image: "images/лес.png" },
        { word: "кит", image: "images/кит.png" },
        { word: "дым", image: "images/дым.png" },
        { word: "дом", image: "images/дом.png" },
    ];

    // ═══════════════════════════════════════════════════════
    //  ЛОГИКА ИГРЫ
    // ═══════════════════════════════════════════════════════

    const allWords = levels.map(l => l.word);
    let currentIndex = 0;
    let isAnimating = false;

    const gameField = document.getElementById('gameField');
    const imageContainer = document.getElementById('imageContainer');
    const imagePlaceholder = document.getElementById('imagePlaceholder');
    const placeholderText = document.getElementById('placeholderText');
    const progressBar = document.getElementById('progressBar');
    const messageOverlay = document.getElementById('messageOverlay');
    const msgEmoji = document.getElementById('msgEmoji');
    const msgText = document.getElementById('msgText');
    const finalScreen = document.getElementById('finalScreen');

    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function pickWrongWords(correctWord, count = 3) {
        const others = allWords.filter(w => w !== correctWord);
        return shuffle(others).slice(0, count);
    }

    function loadLevel(index) {
        if (index >= levels.length) {
            showFinalScreen();
            return;
        }

        isAnimating = false;
        const level = levels[index];
        const correctWord = level.word;

        // Обновляем прогресс
        progressBar.style.width = ((index) / levels.length * 100) + '%';

        // Показываем изображение
        imageContainer.classList.remove('hide');

        // Если есть путь к картинке — показываем img, иначе заглушку
        const imgEl = document.getElementById('gameImage');
        if (level.image && level.image.trim() !== '') {
            if (imgEl) {
                imgEl.src = level.image;
                imgEl.style.display = 'block';
            }
            if (imagePlaceholder) imagePlaceholder.style.display = 'none';
        } else {
            if (imgEl) imgEl.style.display = 'none';
            if (imagePlaceholder) {
                imagePlaceholder.style.display = 'flex';
                placeholderText.textContent = '📷 ' + correctWord;
            }
        }

        // Создаём карточки
        const wrongWords = pickWrongWords(correctWord, 3);
        const options = shuffle([correctWord, ...wrongWords]);
        const positions = ['top', 'left', 'right', 'bottom'];

        // Удаляем старые карточки
        document.querySelectorAll('.word-card').forEach(c => c.remove());

        options.forEach((word, i) => {
            const card = document.createElement('div');
            card.className = 'word-card';
            card.dataset.pos = positions[i];
            card.dataset.word = word;
            card.textContent = word;
            card.addEventListener('click', () => handleCardClick(card, word, correctWord));
            gameField.appendChild(card);
        });
    }

    function handleCardClick(card, selectedWord, correctWord) {
        if (isAnimating) return;

        if (selectedWord === correctWord) {
            isAnimating = true;

            // Правильная карточка
            card.classList.add('correct');

            // Скрываем изображение и все карточки
            setTimeout(() => {
                imageContainer.classList.add('hide');
                document.querySelectorAll('.word-card').forEach(c => c.classList.add('hide'));
            }, 300);

            // Показываем сообщение
            setTimeout(() => {
                const emojis = ['🎉', '⭐', '🌟', '👏', '🥳', '💪', '✨'];
                msgEmoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                msgText.textContent = 'Круто! Продолжай!';
                messageOverlay.classList.add('show');

                setTimeout(() => {
                    messageOverlay.classList.remove('show');
                    currentIndex++;
                    setTimeout(() => loadLevel(currentIndex), 400);
                }, 1400);
            }, 900);

        } else {
            // Неправильно — трясём карточку
            card.classList.add('wrong');
            setTimeout(() => card.classList.remove('wrong'), 600);
        }
    }

    function showFinalScreen() {
        progressBar.style.width = '100%';
        setTimeout(() => {
            finalScreen.classList.add('show');
            launchConfetti();
        }, 300);
    }

    function restartGame() {
        finalScreen.classList.remove('show');
        currentIndex = 0;
        setTimeout(() => loadLevel(0), 400);
    }

    // ═══════════════════════════════════════════════════════
    //  ДЕКОРАТИВНЫЕ ПУЗЫРЬКИ
    // ═══════════════════════════════════════════════════════

    (function createBubbles() {
        const container = document.getElementById('bubbles');
        const colors = ['#ff9a9e', '#a18cd1', '#fbc2eb', '#a8edea', '#fed6e3', '#f6d365', '#84fab0'];
        for (let i = 0; i < 18; i++) {
            const b = document.createElement('div');
            b.className = 'bubble';
            const size = 20 + Math.random() * 80;
            b.style.width = size + 'px';
            b.style.height = size + 'px';
            b.style.left = Math.random() * 100 + '%';
            b.style.background = colors[Math.floor(Math.random() * colors.length)];
            b.style.animationDuration = (8 + Math.random() * 14) + 's';
            b.style.animationDelay = (Math.random() * 10) + 's';
            container.appendChild(b);
        }
    })();

    // ═══════════════════════════════════════════════════════
    //  КОНФЕТТИ (финальный экран)
    // ═══════════════════════════════════════════════════════

    function launchConfetti() {
        const colors = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd','#01a3a4','#f368e0'];
        for (let i = 0; i < 80; i++) {
            const conf = document.createElement('div');
            conf.style.cssText = `
                position: fixed;
                top: -10px;
                left: ${Math.random() * 100}vw;
                width: ${6 + Math.random() * 8}px;
                height: ${6 + Math.random() * 8}px;
                background: ${colors[Math.floor(Math.random() * colors.length)]};
                border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
                z-index: 30;
                pointer-events: none;
                animation: confettiFall ${2 + Math.random() * 3}s linear forwards;
                animation-delay: ${Math.random() * 1.5}s;
            `;
            document.body.appendChild(conf);
            setTimeout(() => conf.remove(), 6000);
        }

        if (!document.getElementById('confettiStyle')) {
            const style = document.createElement('style');
            style.id = 'confettiStyle';
            style.textContent = `
                @keyframes confettiFall {
                    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
                    100% { transform: translateY(100vh) rotate(${360 + Math.random()*720}deg); opacity: 0; }
                }
            `;
            document.head.appendChild(style);
        }
    }

    // ═══════════════════════════════════════════════════════
    //  ЗАПУСК
    // ═══════════════════════════════════════════════════════

    loadLevel(0);

</script>
</body>
</html>
